name: Spring Boot CD

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: "Version of the JAR to deploy"
        required: true
        default: "1.0-SNAPSHOT"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Testing Environment
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Download artifact from JFrog
        run: |
          mkdir -p deployment-artifact

          jf rt download \
            "maven-local/target/github-actions-springboot-${{ inputs.artifact_version }}.jar" \
            "deployment-artifact/" \
            --flat=true

          ls -lh deployment-artifact/

      - name: Copy application to Testing Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "deployment-artifact/*.jar"
          target: "/opt/springboot"

      - name: Deploy application on Testing Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            set -e

            sudo mkdir -p /opt/springboot

            echo "Stopping existing application..."
            sudo pkill -f 'github-actions-springboot.*\.jar' || true

            sleep 5

            echo "Removing old application..."
            sudo rm -f /opt/springboot/github-actions-springboot-*.jar

            echo "Moving new application..."
            sudo mv /opt/springboot/deployment-artifact/*.jar /opt/springboot/app.jar || true

            echo "Starting application..."
            nohup java -jar /opt/springboot/app.jar \
              > /opt/springboot/application.log 2>&1 &

            sleep 10

            echo "Checking application process..."
            pgrep -f 'app.jar'

      - name: Verify application health
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            http://${{ secrets.TEST_SERVER_HOST }}:8080/actuator/health