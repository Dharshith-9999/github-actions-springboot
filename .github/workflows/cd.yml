name: Spring Boot CD

on:
  push:
    branches:
      - feature/08-2026

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Testing Environment
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Download artifact from JFrog
        run: |
          mkdir -p deployment-artifact

          jf rt download \
            "maven-local/target/github-actions-springboot-1.0-SNAPSHOT.jar" \
            "deployment-artifact/" \
            --flat=true \
            --fail-no-op

          ls -lh deployment-artifact/

      - name: Copy application to Testing Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "deployment-artifact/github-actions-springboot-1.0-SNAPSHOT.jar"
          target: "/tmp/springboot-deploy"

      - name: Deploy application on Testing Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            set -e

            sudo mkdir -p /opt/springboot

            echo "Stopping existing application..."

            if [ -f /opt/springboot/app.pid ]; then
              PID=$(cat /opt/springboot/app.pid)

              if kill -0 "$PID" 2>/dev/null; then
                sudo kill "$PID"
                sleep 5
              fi
            fi

            echo "Removing old application..."
            sudo rm -f /opt/springboot/app.jar

            echo "Deploying new application..."
            sudo mv /tmp/springboot-deploy/deployment-artifact/github-actions-springboot-1.0-SNAPSHOT.jar \
              /opt/springboot/app.jar

            echo "Starting application..."
            sudo bash -c '
              nohup java -jar /opt/springboot/app.jar \
                > /opt/springboot/application.log 2>&1 &

              echo $! | sudo tee /opt/springboot/app.pid > /dev/null

            sleep 10

            echo "Checking application..."
            PID=$(cat /opt/springboot/app.pid)
            kill -0 "$PID"

      - name: Verify application health
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            http://${{ secrets.TEST_SERVER_HOST }}:8080/actuator/health
