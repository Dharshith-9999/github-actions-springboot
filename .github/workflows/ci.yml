name: Spring Boot CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read
jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Setup java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      
      - name: Build Application run tests
        run: mvn clean verify

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_USER: admin
          JF_PASSWORD: ${{ secrets.JF_ACCESS_TOKEN }}
      - name: Upload Artifacts to Artifactory
        run: |
          jf rt upload "target/*.jar" "maven-local/" --flat=false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Springboot-Application
          path: target/*.jar
          if-no-files-found: error